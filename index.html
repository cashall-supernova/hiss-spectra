<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HISS Spectra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Spectral:wght@500;600&display=swap">
<style>
/* Layout: an archive index — one scannable table where every row carries a phase strip;
   object pages stack spectra over light curve over the observing log. */
.mast-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 24px; padding: 12px 20px 20px; }
.mast-card { margin: 0; max-width: 420px; }
.mast-card h3 { font-size: var(--step-1); margin: 0 0 10px; }
.mast-card img { display: block; width: 100%; max-width: 400px; height: auto; aspect-ratio: 1; border-radius: var(--radius); background: #17202b; }
.mast-card figcaption { display: grid; gap: 5px; padding-top: 12px; font-size: var(--step--1); color: var(--fg-2); overflow-wrap: anywhere; }
.mast-coverage { display: grid; gap: 4px; padding: 0 20px 14px; font-size: var(--step--1); color: var(--fg-2); }
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --fg: #141821;
  --fg-2: #4a5161;
  --muted: #747c8c;
  --line: #dde1e8;
  --line-strong: #c5cbd5;
  --grid: #e8ebf0;
  --accent: #b03f17;
  --accent-ink: #ffffff;
  --accent-weak: #f7e6de;
  --chip: #eef0f4;
  --warn: #8a5a00;
  --warn-bg: #fdf1d6;
  --telluric: rgba(110, 120, 140, 0.13);
  --epoch: #8c93a3;
  --ramp-a: #86b6ef;
  --ramp-b: #0d366b;
  --ztf-g: #008300;
  --ztf-r: #e34948;
  --atlas-c: #2a78d6;
  --atlas-o: #c98500;
  --atlas-w: #ae62cc;
  --goto-l: #006b78;
  --ukirt-z: #7444a6; --ukirt-y: #007c91; --ukirt-j: #37814f; --ukirt-h: #b74272; --ukirt-k: #81642b;
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100; --cat-5: #e87ba4;
  --font-display: "Spectral", "Iowan Old Style", "Georgia", serif;
  --font-ui: "IBM Plex Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", "SFMono-Regular", "Menlo", "Consolas", monospace;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
  --step-3: 2.125rem;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #191c23; --fg: #e8eaef; --fg-2: #b3b9c5; --muted: #858c9a;
    --line: #2a2f39; --line-strong: #3a404c; --grid: #242932;
    --accent: #f08a5d; --accent-ink: #1a0d06; --accent-weak: #3a2219; --chip: #232731;
    --warn: #f3c25c; --warn-bg: #352a12; --telluric: rgba(160, 170, 190, 0.12); --epoch: #6f7685;
    --ramp-a: #cde2fb; --ramp-b: #2a78d6;
    --ztf-g: #008300; --ztf-r: #e34948; --atlas-c: #3987e5; --atlas-o: #c98500;
    --goto-l: #50d4df; --ukirt-z: #b991ec; --ukirt-y: #52bdcd; --ukirt-j: #73c790; --ukirt-h: #ed85b0; --ukirt-k: #d9bc78;
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #191c23; --fg: #e8eaef; --fg-2: #b3b9c5; --muted: #858c9a;
  --line: #2a2f39; --line-strong: #3a404c; --grid: #242932;
  --accent: #f08a5d; --accent-ink: #1a0d06; --accent-weak: #3a2219; --chip: #232731;
  --warn: #f3c25c; --warn-bg: #352a12; --telluric: rgba(160, 170, 190, 0.12); --epoch: #6f7685;
  --ramp-a: #cde2fb; --ramp-b: #2a78d6;
  --ztf-g: #008300; --ztf-r: #e34948; --atlas-c: #3987e5; --atlas-o: #c98500;
  --goto-l: #50d4df; --ukirt-z: #b991ec; --ukirt-y: #52bdcd; --ukirt-j: #73c790; --ukirt-h: #ed85b0; --ukirt-k: #d9bc78;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); font-size: var(--step-0); line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, tr:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mono, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.top-inner {
  max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 16px;
  justify-content: space-between; flex-wrap: wrap; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; min-width: 0; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  background: linear-gradient(90deg, var(--ramp-a), var(--ramp-b) 55%, var(--accent));
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-text b { font-family: var(--font-display); font-weight: 600; font-size: var(--step-1); letter-spacing: 0.01em; }
.brand-text span { font-size: var(--step--1); color: var(--muted); }
.top-nav { display: flex; gap: 4px; }
.following-head { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:26px 0; }
.following-head h1 { margin-bottom:4px; }
.following-head p { color:var(--muted); margin:0; }
.follow-controls,.following-plot-controls { display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin:16px 0; }
.follow-controls .note { margin:0; }
.follow-controls button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
.following-plot-controls { padding:0 18px; }
.following-table small { display:block; color:var(--muted); font-size:11px; margin-top:5px; }
.following-table td { vertical-align:middle; }
.following-table .following-mag { min-width:240px; }
.following-table .name { min-width:180px; }
.following-table .mono { white-space:nowrap; }
.sky-button:disabled { opacity:.55; cursor:wait; }
@media (max-width:900px) {
  .top-inner { flex-wrap:wrap; }
  .top-nav { flex-wrap:wrap; }
  .following-head { align-items:flex-start; flex-direction:column; }
}
.top-nav a {
  color: var(--fg-2); text-decoration: none; padding: 6px 10px; border-radius: var(--radius);
  font-weight: 500; font-size: var(--step--1);
}
.top-nav a[aria-current="page"] { background: var(--chip); color: var(--fg); }
.count {
  font-family: var(--font-data); font-size: 0.75rem; background: var(--warn-bg); color: var(--warn);
  border-radius: 999px; padding: 0 6px; margin-left: 2px;
}

main { padding-block: 24px 48px; display: flex; flex-direction: column; gap: 28px; }

/* ---------- index ---------- */
.lede { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 28px; }
.lede h1 { font-family: var(--font-display); font-weight: 600; font-size: var(--step-3); line-height: 1.1; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--fg-2); font-size: var(--step--1); }
.stats b { font-family: var(--font-data); font-weight: 500; color: var(--fg); font-size: var(--step-0); margin-right: 4px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.search {
  flex: 1 1 220px; max-width: 360px; height: 36px; padding: 0 12px; border-radius: var(--radius);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font: inherit;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); font: inherit;
  font-size: var(--step--1); padding: 4px 10px; border-radius: 999px; cursor: pointer;
}
.chip .n { font-family: var(--font-data); color: var(--muted); margin-left: 4px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: 0.7; }
.select, .seg button {
  height: 32px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg);
  font: inherit; font-size: var(--step--1); border-radius: var(--radius); padding: 0 8px;
}
label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: var(--step--1); color: var(--fg-2); }

.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
th {
  font-weight: 600; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase;
  background: var(--surface); position: sticky; top: 0;
}
th button { all: unset; cursor: pointer; }
th .unit { text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 500; }
th button:focus-visible { outline: 2px solid var(--accent); }
th[aria-sort="ascending"] button::after { content: " ↑"; }
th[aria-sort="descending"] button::after { content: " ↓"; }
tbody tr:last-child td { border-bottom: 0; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--chip); }
td.name a { font-family: var(--font-display); font-weight: 600; font-size: var(--step-0); color: var(--fg); text-decoration: none; }
td.name a:hover { color: var(--accent); }
td.num, th.num { text-align: right; }
.pill {
  display: inline-block; font-size: 0.75rem; font-weight: 500; padding: 1px 8px; border-radius: 999px;
  background: var(--chip); color: var(--fg-2); border: 1px solid var(--line);
}
.pill.ia { background: var(--accent-weak); color: var(--fg); border-color: transparent; }
.pill.none { color: var(--muted); background: transparent; border-style: dashed; }
.warnmark { color: var(--warn); background: var(--warn-bg); border-radius: 4px; padding: 0 5px; font-size: 0.72rem; font-weight: 600; }
.strip { display: block; }
.strip .axis { stroke: var(--line-strong); }
.strip .zero { stroke: var(--muted); }
.strip .dot { fill: var(--ramp-b); }
.strip .dot.disc { fill: none; stroke: var(--ramp-b); stroke-width: 1.3; }
.strip text { fill: var(--muted); font-family: var(--font-data); font-size: 9px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.legend-note { font-size: var(--step--1); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
.legend-note svg { vertical-align: middle; }

/* ---------- object page ---------- */
.back { font-size: var(--step--1); text-decoration: none; color: var(--fg-2); }
.back:hover { color: var(--accent); }
.obj-head { display: flex; flex-direction: column; gap: 10px; }
.obj-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.obj-title h1 { font-family: var(--font-display); font-weight: 600; font-size: var(--step-3); line-height: 1.1; }
.meta-line { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--fg-2); font-size: var(--step--1); }
.meta-line .k { color: var(--muted); margin-right: 4px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--step--1); align-items: center; }
.linkcopy { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.copytext { font-family: var(--font-data); background: var(--chip); padding: 1px 6px; border-radius: 4px; color: var(--fg); user-select: all; }
.copybtn { font: inherit; font-size: 0.75rem; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg-2);
  border-radius: var(--radius); padding: 1px 8px; cursor: pointer; }
.facts {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden;
}
.fact { padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.fact dt { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.fact dd { margin: 2px 0 0; font-family: var(--font-data); font-size: var(--step-0); overflow-wrap: anywhere; }
.fact dd small { font-family: var(--font-ui); color: var(--muted); font-size: var(--step--1); display: block; }

.panel { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
.panel-head h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--step-2); }
.sky-frame { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; border: 1px solid var(--line); border-radius: var(--radius); background: #080b12; }
.sky-button { font: inherit; color: var(--fg-2); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 5px 10px; cursor: pointer; }
.line-controls { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.line-controls summary { padding: 10px 12px; cursor: pointer; font-weight: 500; }
.line-controls summary span { font-weight: 400; color: var(--muted); font-size: var(--step--1); margin-left: 10px; }
.line-controls-body { display: flex; flex-direction: column; gap: 12px; padding: 0 12px 14px; }
.velocity-controls { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 4; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.velocity-controls .note { margin: 6px 0 0; }
.spectra-workspace { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 14px; align-items: start; }
.spectra-workspace #specplot { min-width: 0; min-height: 380px; }
.spectrum-controls { position: sticky; top: calc(160px + env(safe-area-inset-top, 0px)); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; background: var(--surface); min-width: 0; }
.spectrum-controls-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px; margin-bottom: 8px; }
.spectrum-controls h3 { font-size: var(--step--1); font-weight: 600; }
.spectrum-controls-head .muted { font-size: 0.75rem; }
.spectrum-controls .toolbar { gap: 6px; }
.spectrum-controls button { font-size: var(--step--1); }
.spectrum-choices { max-height: 360px; overflow-y: auto; margin-top: 10px; }
.spectrum-choice { display: flex; align-items: flex-start; gap: 6px; padding: 6px 0; cursor: pointer; font-size: var(--step--1); }
.spectrum-choice input { accent-color: var(--accent); margin-top: 4px; flex: none; }
.spectrum-choice .swatch { margin-top: 7px; flex: none; }
.spectrum-choice small { display: block; font-size: 0.72rem; color: var(--muted); overflow-wrap: anywhere; }
@media (max-width: 800px) {
  .velocity-controls, .spectrum-controls { position: static; }
  .spectra-workspace { grid-template-columns: minmax(0, 1fr); }
  .spectrum-controls { grid-row: 1; }
  .spectrum-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); max-height: 130px; }
}
.velocity-input { width: 130px; }
#line-velocity-range { width: min(300px, 100%); accent-color: var(--accent); }
.line-error { margin: 0; color: var(--warn); font-size: var(--step--1); }
.line-error:empty { display: none; }
.line-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.line-groups fieldset { min-width: 0; margin: 0; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
.line-groups legend { font-weight: 500; padding: 0 4px; }
.line-groups input { accent-color: var(--accent); }
.line-choice { display: flex; align-items: baseline; gap: 5px; padding: 3px 0; font-size: var(--step--1); }
.line-choice .mono { margin-left: auto; color: var(--fg-2); font-size: 0.75rem; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; cursor: pointer; color: var(--fg-2); }
.seg button:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
.seg button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); position: relative; }
.plot {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  min-height: 320px;
}
.note { font-size: var(--step--1); color: var(--muted); max-width: 80ch; margin: 0; }
.note code, .empty code { font-family: var(--font-data); background: var(--chip); padding: 1px 5px; border-radius: 4px; color: var(--fg-2); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
td input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
td.file { font-family: var(--font-data); font-size: 0.75rem; color: var(--fg-2); white-space: normal; min-width: 220px; overflow-wrap: anywhere; }
td.file .alias { color: var(--muted); display: block; }
.issue-list { margin: 0; padding-left: 18px; color: var(--fg-2); font-size: var(--step--1); }
.issue-list li { margin: 2px 0; }

.foot { color: var(--muted); font-size: var(--step--1); padding-block: 0 32px; }

@media (max-width: 720px) {
  :root { --step-3: 1.75rem; }
  .hide-sm { display: none; }
  th, td { padding: 8px 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- sign-in front page ---------- */
body.locked .top-nav { display: none; }
.login { display: flex; justify-content: center; padding-block: 6vh 10vh; }
.login-card { max-width: 380px; }
.login-card {
  width: 100%; display: flex; flex-direction: column; gap: 14px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px 26px;
}
.login-card h1 { font-family: var(--font-display); font-weight: 600; font-size: var(--step-3); line-height: 1.1; }
.login-card p { margin: 0; font-size: var(--step--1); }
.brand-mark.big { width: 44px; height: 44px; display: block; }
#login { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
#login label:not(.inline) { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 4px; }
#login input:not([type="checkbox"]) {
  height: 40px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--line-strong);
  background: var(--bg); color: var(--fg); font: inherit;
}
#login .remember { margin-top: 4px; }
#login input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.login-error { color: var(--warn); background: var(--warn-bg); border-radius: var(--radius); padding: 8px 10px; }
button.primary {
  margin-top: 8px; height: 42px; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--accent-ink);
  font: inherit; font-weight: 600; cursor: pointer;
}
button.primary:disabled { opacity: 0.7; cursor: progress; }
.glance {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px;
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.pies { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px 32px; }
.pie { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pie figcaption { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pie-body { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.pie svg { flex: none; max-width: 100%; height: auto; }
.pie .slice { stroke: var(--surface); stroke-width: 2; stroke-linejoin: round; }
.pie-total { font-family: var(--font-data); font-size: 24px; font-weight: 500; fill: var(--fg); }
.pie-unit { font-size: 11px; fill: var(--muted); }
.pie-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: var(--step--1); min-width: 150px; }
.pie-legend li { display: grid; grid-template-columns: 14px minmax(6.5em, 1fr) 2.6em 3em; align-items: center; gap: 6px; }
.pie-legend .swatch { width: 10px; height: 10px; border-radius: 2px; margin: 0; }
.pie-legend .num { text-align: right; }

/* Nightly geometry shares the existing chart style. */
.visibility-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
.visibility-summary > div { border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; background:var(--surface); }
.visibility-summary .k { display:block; color:var(--muted); font-size:.72rem; margin-bottom:5px; }
.visibility-summary strong { display:block; font-family:var(--font-data); font-size:.9rem; font-weight:500; }
.visibility-summary small { display:block; color:var(--muted); font-size:.75rem; margin-top:4px; }
.visibility-key { display:flex; flex-wrap:wrap; gap:8px 20px; font-size:var(--step--1); color:var(--fg-2); }
.visibility-key span { display:inline-flex; align-items:center; gap:6px; }
.visibility-key i { width:14px; height:14px; border:1px solid var(--line-strong); border-radius:2px; }
.visibility-day { background:rgba(238,190,80,.17); }
.visibility-twilight { background:rgba(115,150,198,.10); }
.visibility-dark { background:rgba(66,91,141,.20); }
#visibility-date { font:inherit; max-width:170px; color-scheme:light dark; }
#visibility-plot { min-height:340px; }

.observing-workspace { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; align-items:start; }
.observing-workspace .panel-head { align-items:start; }
.observing-workspace .toolbar { flex-wrap:wrap; }
.observing-workspace .visibility-summary { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.observing-workspace .visibility-summary > div { padding:9px 10px; }
.observing-workspace .visibility-summary strong { font-size:.8rem; }
.observing-workspace .visibility-summary small { font-size:.7rem; }
#visibility-site { max-width:180px; }
@media (max-width: 900px) { .observing-workspace { grid-template-columns:minmax(0,1fr); } }

  // Part-to-whole charts (targets and spectra by type) for the Targets page
  function donut(groups, key, unit, title) {
    var total = groups.reduce(function (a, g) { return a + g[key]; }, 0);
    if (!total) return "";
    var R = 74, r = 48, c = 80, a0 = -Math.PI / 2, paths = "";
    var pt = function (rad, a) { return (c + rad * Math.cos(a)).toFixed(2) + " " + (c + rad * Math.sin(a)).toFixed(2); };
    groups.forEach(function (g, i) {
      var n = g[key];
      if (!n) return;
      var a1 = a0 + (n / total) * 2 * Math.PI, pct = Math.round(100 * n / total);
      var tip = "<title>" + esc(g.name) + ": " + n + " " + unit + " (" + pct + "%)</title>";
      if (n === total) {
        paths += '<circle cx="80" cy="80" r="' + (R + r) / 2 + '" fill="none" stroke="var(--cat-' + (i + 1) + ')" stroke-width="' + (R - r) + '">' + tip + "</circle>";
      } else {
        var big = a1 - a0 > Math.PI ? 1 : 0;
        paths += '<path class="slice" d="M' + pt(R, a0) + " A" + R + " " + R + " 0 " + big + " 1 " + pt(R, a1) + " L" + pt(r, a1) +
          " A" + r + " " + r + " 0 " + big + " 0 " + pt(r, a0) + ' Z" fill="var(--cat-' + (i + 1) + ')">' + tip + "</path>";
      }
      a0 = a1;
    });
    var legend = groups.map(function (g, i) {
      if (!g[key]) return "";
      return '<li><span class="swatch" style="background:var(--cat-' + (i + 1) + ')"></span><span class="lg-name">' + esc(g.name) +
        '</span><span class="num">' + g[key] + '</span><span class="num muted">' + Math.round(100 * g[key] / total) + "%</span></li>";
    }).join("");
    return '<figure class="pie"><figcaption>' + esc(title) + "</figcaption>" +
      '<div class="pie-body"><svg viewBox="0 0 160 160" width="150" height="150" role="img" aria-label="' + esc(title) + ": " +
      groups.filter(function (g) { return g[key]; }).map(function (g) { return g.name + " " + g[key]; }).join(", ") + '">' + paths +
      '<text x="80" y="80" text-anchor="middle" class="pie-total">' + total + '</text><text x="80" y="98" text-anchor="middle" class="pie-unit">' + unit + "</text></svg>" +
      '<ul class="pie-legend">' + legend + "</ul></div></figure>";
  }
  var PIE_GROUPS = ["Ia", "II", "Ib/c", "SLSN & TDE", "Other"];

  // ------------------------------------------------------------- data loading
  function loadObject(id) {
    if (cache[id]) return Promise.resolve(cache[id]);
    var session = sessionVersion;
    var url = "data/obj/" + encodeURIComponent(id) + ".js";
    // A refreshed index must not reuse a target file cached before the latest build.
    var revision = IDX && (IDX.data_revision || IDX.built);
    if (location.protocol !== "file:" && revision) url += "?v=" + encodeURIComponent(revision);
    var remember = function (o) {
      if (session !== sessionVersion) throw new Error("The sign-in session has ended.");
      cache[id] = o;
      return o;
    };
    var finish = function (d) {
      if (typeof d !== "string") return Promise.resolve(d);
      return unseal(KEY, d).then(JSON.parse);
    };
    if (location.protocol === "file:") {
      return new Promise(function (resolve, reject) {
        window.HISS_DATA = function (d) { finish(d).then(remember).then(resolve, reject); };
        var s = document.createElement("script");
        s.src = url;
        s.onerror = function () { reject(new Error("Could not read " + url)); };
        document.head.appendChild(s);
      });
    }
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("The data file for " + id + " is missing (HTTP " + r.status + "). Rebuild the site.");
      return r.text();
    }).then(function (t) {
      return finish(JSON.parse(t.slice(t.indexOf("(") + 1, t.lastIndexOf(")"))));
    }).then(remember);
  }

    }
    L.shapes.push({type:'line',xref:'x2',yref:'y',x0:16,x1:data.endHour,y0:2,y1:2,line:{color:css('--muted'),width:1,dash:'dot'}});
    L.shapes.push({type:'line',xref:'x',yref:'y2',x0:16,x1:data.endHour,y0:0,y1:0,line:{color:css('--fg-2'),width:1}});

  function mastPanel(o) {

    if (archive.status === "failed") message += " The latest MAST check failed; any earlier stamps are retained.";
    if (archive.status === "partial") message += " Some products could not be refreshed; available stamps are shown below.";
    var cards = images.filter(function (im) {
      return /^(HST|JWST)$/.test(im.mission) && /^iVBORw0KGgo[A-Za-z0-9+/=]+$/.test(im.png_base64 || "");
    }).map(function (im) {
      var date = im.date_start || "Date unavailable";
      if (im.date_end && im.date_end !== im.date_start) date += " to " + im.date_end;
      var epoch = "";

        epoch = im.mjd_end < o.discovery_mjd ? "Before discovery" : im.mjd_start >= o.discovery_mjd ? "After discovery" : "Spans discovery";
      }

        '<a href="' + esc(im.download_url) + '" target="_blank" rel="noopener noreferrer">Calibrated FITS ↗</a>' : "";
      var cached = archive.status === "failed" || (archive.missions && archive.missions[im.mission] && archive.missions[im.mission].status === "cached");
      var wavelength = im.mission === "JWST" && Number.isFinite(im.nominal_wavelength_um) ? ' (≈' + esc(im.nominal_wavelength_um) + ' µm)' : '';
      return '<figure class="mast-card"><h3>' + esc(im.mission) + ' · ' + esc(im.filter === "detection" ? "Combined filters" : (im.filter || "Combined filters")) + wavelength + '</h3>' +
        '<img width="320" height="320" loading="lazy" alt="' + esc(im.mission + ' archival image centred on ' + o.name + '; crosshair marks the catalogue position') +
        '" src="data:image/png;base64,' + im.png_base64 + '">' +

      return '<span><b>' + mission + ':</b> ' + label + '</span>';

      '<p class="note">' + message + '</p><div class="mast-coverage">' + coverage + '</div>' +
      (cards ? '<div class="mast-grid">' + cards + '</div><p class="note">Crosshair: catalogue SN position. North is up; east is left. Each 20″ stamp has its own asinh brightness stretch; grey areas have no usable pixels. Archival coverage does not establish an SN detection.</p>' : '') +

    ["br-delta", "Brδ", 1.9446, "Hydrogen", false], ["br-gamma", "Brγ", 2.1655, "Hydrogen", true],

      y: epochs.map(function () { return top; }),
      marker: { symbol: "triangle-down", size: 11, color: css("--accent") },
      text: o.spectra.filter(function (s) { return s.mjd != null; }).map(function (s) { return s.date + " · " + fmtPhase(s.phase, o.phase_ref) + " · " + [s.instrument, s.mode].filter(Boolean).join(" "); }),
      hovertemplate: "Spectrum %{text}<extra></extra>"
    });
    var shapes = epochs.map(function (m) {
      return { type: "line", xref: "x", yref: "paper", x0: X(m), x1: X(m), y0: 0, y1: 1, line: { color: css("--epoch"), width: 1, dash: "dash" }, layer: "below" };
    });
    var ann = [];
    if (o.peak && o.peak.mjd && o.phase_ref === "peak") {
      shapes.push({ type: "line", xref: "x", yref: "paper", x0: X(o.peak.mjd), x1: X(o.peak.mjd), y0: 0, y1: 1, line: { color: css("--accent"), width: 1.5 } });
      ann.push({ x: X(o.peak.mjd), y: 0, xref: "x", yref: "paper", yanchor: "bottom", xanchor: "left", showarrow: false, xshift: 4, yshift: 4,
        text: "peak", font: { size: 11, color: css("--accent") } });
    }
    var nowMJD = Date.now() / 86400000 + 40587;
    if (recentDiscovery(o, nowMJD)) {
      var currentShape = shapes.length, currentLabel = ann.length;
      xs.push(X(nowMJD)); // Keep today's line visible in the initial light-curve view.
      shapes.push({ type: "line", name: "current-mjd", xref: "x", yref: "paper", x0: X(nowMJD), x1: X(nowMJD), y0: 0, y1: 1,
        line: { color: css("--ramp-b"), width: 1.8, dash: "dot" } });
      ann.push({ name: "current-mjd-label", x: X(nowMJD), y: 0.98, xref: "x", yref: "paper", xanchor: "right", yanchor: "top",
        showarrow: false, xshift: -5, text: "Current MJD " + nowMJD.toFixed(2), bgcolor: css("--surface"),
        font: { size: 11, color: css("--ramp-b") } });
      refreshLCNow = function () {
        if (!window.Plotly || !Plotly.relayout || !el.classList.contains("js-plotly-plot")) return;
        var now = Date.now() / 86400000 + 40587, visible = recentDiscovery(o, now), update = {};
        update["shapes[" + currentShape + "].x0"] = X(now);
        update["shapes[" + currentShape + "].x1"] = X(now);
        update["shapes[" + currentShape + "].visible"] = visible;
        update["annotations[" + currentLabel + "].x"] = X(now);
        update["annotations[" + currentLabel + "].text"] = "Current MJD " + now.toFixed(2);
        update["annotations[" + currentLabel + "].visible"] = visible;
        // Move only the clock marker; leave the user's zoom and band selection alone.
        Plotly.relayout(el, update);
        if (!visible) refreshLCNow = null;
      };
    }
    var L = baseLayout();
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), pad = Math.max(3, 0.04 * (x1 - x0));
    L.height = 420;
    var legendRows = Math.ceil(traces.filter(function (t) { return t.showlegend !== false; }).length / Math.max(2, Math.floor(((el.clientWidth || 800) - 80) / 100)));
    L.margin = { l: 56, r: 24, t: 20 + 22 * legendRows, b: 52 };
    L.height += 22 * Math.max(0, legendRows - 1);
    L.showlegend = true;
    L.legend = { orientation: "h", x: 0, y: 1.02, yanchor: "bottom", font: { size: 11 } };
    L.xaxis.title = { text: usePhase ? "Rest-frame days " + (o.phase_ref === "peak" ? "from peak" : "from discovery") : "MJD", standoff: 8 };
    L.xaxis.range = [x0 - pad, x1 + pad];
    L.yaxis.title = { text: "AB magnitude", standoff: 6 };
    L.yaxis.range = [mhi + 0.4, top - 0.3];
    L.shapes = shapes; L.annotations = ann;
    draw(el, traces, L, o.id + "_lightcurve");
    note.textContent = src.join(" · ") + (state.lcx === "phase" && ref == null ? " · No reference epoch, so the axis shows MJD." : "") +
      (epochs.length ? " · Triangles along the top mark spectra." : "");
  }

  // ------------------------------------------------------------------- boot
  var started = false;
  function start() {
    document.body.classList.remove("locked");
    $("#brand-title").textContent = IDX.title || "HISS Spectra";
    $("#brand-sub").textContent = IDX.subtitle || "";
    var nP = IDX.problems.length;
    $("#checks-count").textContent = nP ? String(nP) : "";
    $("#foot").innerHTML = "Built " + esc(IDX.built) + " from the team's reduced spectra and photometry. Phases are rest-frame days: (MJD − reference) / (1 + z). " +
      "Light curves: ZTF alerts from ALeRCE, ATLAS forced photometry, GOTO L-band, and UKIRT AB photometry.";
    $("#nav-out").hidden = !LOCK;
    if (!started) {
      started = true;
      Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function (a) {
        a.addEventListener("click", function (e) {
          if (a.getAttribute("data-nav") === "home" && !location.hash) { e.preventDefault(); route(); }
        });
      });
      window.addEventListener("hashchange", route);
      if (window.setInterval) window.setInterval(function () {
        if (IDX && !document.hidden) { syncFollowing(); if (location.hash === "#following") plotFollowingVisibility(); }
        if (current && !document.hidden) { plotVisibility(current); if (refreshLCNow) refreshLCNow(); }
      }, 60000);
      var rerender = function () { if (current) { plotSpectra(current); plotLC(current); fillLog(current); plotVisibility(current); } else if (location.hash === "#following") plotFollowingVisibility(); else route(); };
      try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rerender); } catch (e) { /* old browsers */ }
      new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
      $("#nav-out").addEventListener("click", function (e) {
        e.preventDefault();
        sessionVersion++;
        clearFollowing(); forgetKey(); KEY = null; IDX = null; cache = {}; current = null;
        renderLogin("You are signed out.");
      });
    }
    route();
  }
  function boot() {
    if (!LOCK) { start(); return; }
    var saved = storedKey();
    if (!saved) { renderLogin(); return; }
    try {
      tryRaw(b64bytes(saved)).then(start, function () { forgetKey(); renderLogin(); });
    } catch (e) { forgetKey(); renderLogin(); }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
